<button type="button" class="skip-link" [attr.aria-current]="activeSection() === 'contenido' ? 'location' : null" (click)="scrollTo('contenido')">Ir al contenido</button>
<app-header />
@if (breadcrumb(); as current) {
  <nav class="breadcrumbs container" aria-label="Migas de pan">
    <a routerLink="/">Inicio</a><span aria-hidden="true">›</span><span aria-current="page">{{ current }}</span>
  </nav>
}
<main id="contenido" class="app-content" tabindex="-1">
  <router-outlet />
</main>
<app-footer />
