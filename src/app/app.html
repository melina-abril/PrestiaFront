<button type="button" class="skip-link" [attr.aria-current]="activeSection() === 'contenido' ? 'location' : null" (click)="scrollTo('contenido')">Ir al contenido</button>
<app-header />
<div class="app-shell">
  @if (breadcrumbs().length > 0) {
    <nav class="breadcrumbs" aria-label="Migas de pan">
      <ol>
        @for (crumb of breadcrumbs(); track $index) {
          <li>
            @if (crumb.path; as path) {
              <a [routerLink]="'/' + path">{{ crumb.label }}</a>
            } @else {
              <span aria-current="page">{{ crumb.label }}</span>
            }
          </li>
        }
      </ol>
    </nav>
  }
  <main id="contenido" class="app-content" tabindex="-1">
    <router-outlet />
  </main>
</div>
<app-footer />
